# Alembic config
# LuomiNest SQLite migration management
# sqlalchemy.url is injected at runtime by env.py from settings.DATABASE_URL

[alembic]
# Migration script directory (%(here)s = directory of this ini file)
script_location = %(here)s
# template (leave empty for default)
# version_path_separator = os
sqlalchemy.url =

# SQLite batch mode (ALTER TABLE requires it)
# Enabled via render_as_batch=True in env.py

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
