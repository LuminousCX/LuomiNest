[project]
name = "luominest"
version = "0.7.7"
description = "LuomiNest - Distributed Whole-House AI Companion System"
requires-python = ">=3.12"
license = {text = "AGPL-3.0"}
authors = [
    {name = "LuminousCX R&D Team"}
]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.18",
    "aiofiles>=24.1.0",
    "aiosqlite>=0.20.0",
    "httpx>=0.28.0",
    "aiohttp>=3.9.0",
    "websockets>=14.0",
    "paho-mqtt>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14.0",
    "numpy>=2.2.0",
    "psutil>=5.9.0",
    "cryptography>=44.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-magic>=0.4.27",
    "pillow>=11.0.0",
    "loguru>=0.7.3",
    "orjson>=3.10.0",
    "tenacity>=9.0.0",
    "tzdata>=2024.1",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "edge-tts>=6.1.18",
    "mcp>=1.0.0",
    "apscheduler>=3.10.0",
    "python-a2a>=0.5.0",
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
extras = [
    "openai>=1.58.0",
    "anthropic>=0.42.0",
    "asyncpg>=0.30.0",
    "redis[hiredis]>=5.2.0",
    "pgvector>=0.3.6",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]
voice = [
    "soundfile>=0.12.1",
    "pyttsx3>=2.90",
    "sherpa-onnx>=1.10.0",
    "faster-whisper>=1.0.0",
    "funasr>=1.0.27",
    "modelscope>=1.10.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "sentence-transformers>=2.2.0",
]
render = [
    "cubism-live2d-core>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
