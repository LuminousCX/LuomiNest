[project]
name = "luominest"
version = "0.7.7"
description = "LuomiNest - Distributed Whole-House AI Companion System"
requires-python = ">=3.12"
license = {text = "AGPL-3.0"}
authors = [
    {name = "LuminousCX R&D Team"}
]

# 下限 = 2026-09-06 全量重建 venv 后逐包验证过的最新稳定版
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "aiohttp>=3.14.3",
    "websockets>=16.1.1",
    "paho-mqtt>=2.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.2",
    "numpy>=2.5.2",
    "psutil>=7.2.2",
    "cryptography>=50.0.1",
    "python-jose[cryptography]>=3.5.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4（已停更）与 bcrypt 5.x 不兼容：hash() 直接抛 ValueError，鉴权全挂，故钉在 4.x
    "bcrypt>=4.1.0,<5.0.0",
    "python-magic>=0.4.27",
    "pillow>=12.3.0",
    "loguru>=0.7.3",
    "orjson>=3.12.0",
    "tenacity>=9.1.4",
    "tzdata>=2026.3",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "edge-tts>=7.2.8",
    "mcp>=2.1.1",
    "apscheduler>=3.11.3",
    "python-a2a>=0.5.10",
    "slowapi>=0.1.10",
]

[project.optional-dependencies]
extras = [
    "openai>=3.8.0",
    "anthropic>=1.4.0",
    "asyncpg>=0.31.0",
    "redis[hiredis]>=8.1.0",
    "pgvector>=0.5.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
]
voice = [
    "soundfile>=0.12.1",
    "pyttsx3>=2.90",
    "sherpa-onnx>=1.10.0",
    "faster-whisper>=1.0.0",
    "funasr>=1.0.27",
    "modelscope>=1.10.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "sentence-transformers>=2.2.0",
]
render = [
    "cubism-live2d-core>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
