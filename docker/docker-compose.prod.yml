# LuomiNest - Production Overrides
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
version: "3.8"

services:
  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  redis:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  mqtt:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  backend:
    restart: always
    ports:
      - "${BACKEND_PORT:-18000}:18000"
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}
      resources:
        limits:
          cpus: "2"
          memory: 2G
    command: ["/app/start.sh"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18000/api/v1/system/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
