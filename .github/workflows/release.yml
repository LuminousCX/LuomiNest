name: Build & Release

# Triggers:
#   1. Stable release  -> push a tag matching v*            (stable release)
#   2. Version bump     -> push to main that modifies the    (pre-release)
#                          version field in package.json /
#                          pyproject.toml
#   3. Manual dispatch   -> workflow_dispatch                (pre-release)
#
# The detect job verifies that the version string actually changed
# between HEAD and HEAD~1, so reformatting a version file without a
# real bump does not waste CI minutes.
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/package.json'
      - 'backend/pyproject.toml'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all platforms (otherwise only the tagged release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Cancel in-progress runs for the same ref to save CI resources
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this run should produce a release. Triggering on the
  # version file paths is necessary but not sufficient - the file might
  # be touched without an actual version bump. This job compares the
  # version string between HEAD and its parent to decide, and also
  # derives the tag/name used by the downstream release job.
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      name: ${{ steps.check.outputs.name }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read project version
        id: version
        shell: bash
        run: |
          # frontend/package.json is the source of truth for the bundle version
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Decide whether to build and derive release metadata
        id: check
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Stable release from a v* tag
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=LuomiNest ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag push -> stable release"
            exit 0
          fi
          # Pre-release for both manual dispatch and version commits
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=LuomiNest ${VERSION} (dev ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch -> pre-release"
            exit 0
          fi
          # Branch push: only build if the version string actually changed
          if git diff HEAD~1 HEAD --name-only | grep -qE '^(frontend/package\.json|backend/pyproject\.toml)$'; then
            PREV_VERSION=$(git show HEAD~1:frontend/package.json 2>/dev/null \
              | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || echo "")
            if [[ -z "$PREV_VERSION" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "tag=v${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              echo "name=LuomiNest ${VERSION} (dev ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
              echo "No previous version baseline -> building"
            elif [[ "$PREV_VERSION" != "$VERSION" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "tag=v${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              echo "name=LuomiNest ${VERSION} (dev ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
              echo "Version changed: $PREV_VERSION -> $VERSION"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged ($VERSION) -> skipping build"
            fi
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Version files not modified -> skipping build"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm libxtst6 libnss3 libnotify4

      - name: Install backend dependencies
        shell: bash
        run: |
          cd backend
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pip install --upgrade pip
          pip install pyinstaller
          # Install dev deps only - voice deps (torch, faster-whisper, etc.)
          # are heavy and not needed for the bundled backend. They are
          # lazily imported at runtime and fall back gracefully.
          pip install -e ".[dev]"

      - name: Build backend
        shell: bash
        run: |
          cd backend
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pyinstaller luominest-backend.spec --clean --noconfirm

      - name: Verify backend build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BACKEND_EXE="backend/dist/luominest-backend/luominest-backend.exe"
          else
            BACKEND_EXE="backend/dist/luominest-backend/luominest-backend"
          fi
          if [ ! -f "$BACKEND_EXE" ]; then
            echo "[ERROR] Backend executable not found: $BACKEND_EXE"
            exit 1
          fi
          echo "[OK] Backend executable verified: $BACKEND_EXE"

      - name: Prepare backend resources
        shell: bash
        run: |
          mkdir -p frontend/resources/backend
          # Copy the entire backend dist folder (exe + shared libs) so the
          # bundled executable can find its dependencies at runtime.
          cp -r backend/dist/luominest-backend/* frontend/resources/backend/
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x frontend/resources/backend/luominest-backend
          fi

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Build Windows packages
        if: matrix.platform == 'win'
        run: |
          cd frontend
          pnpm exec electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: 'false'

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: |
          cd frontend
          pnpm exec electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS packages
        if: matrix.platform == 'mac'
        run: |
          cd frontend
          pnpm exec electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuomiNest-${{ matrix.platform }}
          path: |
            frontend/release/dist/*
            !frontend/release/dist/win-unpacked
            !frontend/release/dist/linux-unpacked
            !frontend/release/dist/mac
          if-no-files-found: error

  create-release:
    needs: [detect, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: ${{ needs.detect.outputs.name }}
          draft: false
          prerelease: ${{ needs.detect.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/LuomiNest-win/*.exe
            artifacts/LuomiNest-linux/*.AppImage
            artifacts/LuomiNest-linux/*.deb
            artifacts/LuomiNest-mac/*.dmg
            artifacts/LuomiNest-mac/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
