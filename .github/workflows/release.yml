name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all platforms (otherwise only the tagged release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Cancel in-progress runs for the same ref to save CI resources
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm libxtst6 libnss3 libnotify4

      - name: Install backend dependencies
        shell: bash
        run: |
          cd backend
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pip install --upgrade pip
          pip install pyinstaller
          # Install dev deps only - voice deps (torch, faster-whisper, etc.)
          # are heavy and not needed for the bundled backend. They are
          # lazily imported at runtime and fall back gracefully.
          pip install -e ".[dev]"

      - name: Build backend
        shell: bash
        run: |
          cd backend
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pyinstaller luominest-backend.spec --clean --noconfirm

      - name: Verify backend build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BACKEND_EXE="backend/dist/luominest-backend/luominest-backend.exe"
          else
            BACKEND_EXE="backend/dist/luominest-backend/luominest-backend"
          fi
          if [ ! -f "$BACKEND_EXE" ]; then
            echo "[ERROR] Backend executable not found: $BACKEND_EXE"
            exit 1
          fi
          echo "[OK] Backend executable verified: $BACKEND_EXE"

      - name: Prepare backend resources
        shell: bash
        run: |
          mkdir -p frontend/resources/backend
          # Copy the entire backend dist folder (exe + shared libs) so the
          # bundled executable can find its dependencies at runtime.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp -r backend/dist/luominest-backend/* frontend/resources/backend/
          else
            cp -r backend/dist/luominest-backend/* frontend/resources/backend/
            chmod +x frontend/resources/backend/luominest-backend
          fi

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Build Windows packages
        if: matrix.platform == 'win'
        run: |
          cd frontend
          pnpm exec electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_HARD_LINKS: 'false'

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: |
          cd frontend
          pnpm exec electron-builder --linux AppImage deb
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS packages
        if: matrix.platform == 'mac'
        run: |
          cd frontend
          pnpm exec electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuomiNest-${{ matrix.platform }}
          path: |
            frontend/release/dist/*
            !frontend/release/dist/win-unpacked
            !frontend/release/dist/linux-unpacked
            !frontend/release/dist/mac
          if-no-files-found: error

  create-release:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: |
            artifacts/LuomiNest-win/*.exe
            artifacts/LuomiNest-linux/*.AppImage
            artifacts/LuomiNest-linux/*.deb
            artifacts/LuomiNest-mac/*.dmg
            artifacts/LuomiNest-mac/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
