name: Build & Release

# Triggers:
#   1. Stable release  -> push a tag matching v*            (stable release)
#   2. Version bump     -> push to main that modifies the    (pre-release)
#                          version field in package.json /
#                          pyproject.toml
#   3. Manual dispatch   -> workflow_dispatch                (pre-release)
#
# The detect job verifies that the version string actually changed
# between HEAD and HEAD~1, so reformatting a version file without a
# real bump does not waste CI minutes.
on:
  push:
    branches:
      - master
    paths:
      - 'frontend/package.json'
      - 'backend/pyproject.toml'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all platforms (otherwise only the tagged release)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

# Cancel in-progress runs for the same ref to save CI resources
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decide whether this run should produce a release. Triggering on the
  # version file paths is necessary but not sufficient - the file might
  # be touched without an actual version bump. This job compares the
  # version string between HEAD and its parent to decide, and also
  # derives the tag/name used by the downstream release job.
  detect:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      name: ${{ steps.check.outputs.name }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read project version
        id: version
        shell: bash
        run: |
          # frontend/package.json is the source of truth for the bundle version
          VERSION=$(node -p "require('./frontend/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Decide whether to build and derive release metadata
        id: check
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Stable release from a v* tag
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "name=LuomiNest ${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag push -> stable release"
            exit 0
          fi
          # Pre-release for both manual dispatch and version commits
          echo "prerelease=true" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "tag=v${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
            echo "name=LuomiNest ${VERSION} (dev ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch -> pre-release"
            exit 0
          fi
          # Branch push: only build if the version string actually changed
          if git diff HEAD~1 HEAD --name-only | grep -qE '^(frontend/package\.json|backend/pyproject\.toml)$'; then
            PREV_VERSION=$(git show HEAD~1:frontend/package.json 2>/dev/null \
              | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || echo "")
            if [[ -z "$PREV_VERSION" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "tag=v${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              echo "name=LuomiNest ${VERSION} (dev ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
              echo "No previous version baseline -> building"
            elif [[ "$PREV_VERSION" != "$VERSION" ]]; then
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "tag=v${VERSION}-dev.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
              echo "name=LuomiNest ${VERSION} (dev ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
              echo "Version changed: $PREV_VERSION -> $VERSION"
            else
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "Version unchanged ($VERSION) -> skipping build"
            fi
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"
            echo "Version files not modified -> skipping build"
          fi

  release:
    needs: detect
    if: needs.detect.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
          # 注意不要升到 ubuntu-latest（24.04, glibc 2.39）：PyInstaller 不做
          # glibc 向后兼容，22.04/Debian 12 用户的后端会报 GLIBC_2.3x not found。
          - os: ubuntu-22.04
            platform: linux
          - os: macos-latest
            platform: mac

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # 显式钉住与 frontend/package.json packageManager 一致的版本：
          # action-setup 只在仓库根找 packageManager 字段，而本仓库声明在 frontend/ 下，
          # 不传 version 会直接失败
          version: 10.34.5

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/pyproject.toml

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rpm libxtst6 libnss3 libnotify4

      - name: Download TTS model
        shell: bash
        run: |
          # electron-builder extraResources 引用 backend/models/tts/vits-melo-tts-zh_en，
          # 模型不进 git（~162MB），CI 上必须先补齐，否则三平台打包全部失败。
          # 后端运行时对 voice 依赖懒加载，但模型文件本身是 extraResources 的硬引用。
          mkdir -p backend/models/tts
          curl -L --fail --retry 3 -o /tmp/tts-model.tar.bz2 \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-melo-tts-zh_en.tar.bz2
          tar -xjf /tmp/tts-model.tar.bz2 -C backend/models/tts
          ls -la backend/models/tts/vits-melo-tts-zh_en

      - name: Install backend dependencies
        shell: bash
        run: |
          cd backend
          python -m venv .venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          # Windows venv 内 pip.exe 无法自替换，升级/安装一律走 python -m pip
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          # Install dev + extras deps - spec 的 hiddenimports 引用 extras 里的
          # pgvector/redis/asyncpg；voice 重型依赖（torch 等）仍不装，运行时
          # 懒加载、缺失时优雅降级。
          python -m pip install -e ".[dev,extras]"
      - name: Build backend
        shell: bash
        run: |
          cd backend
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            source .venv/Scripts/activate
          else
            source .venv/bin/activate
          fi
          pyinstaller luominest-backend.spec --clean --noconfirm

      - name: Verify backend build
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            BACKEND_EXE="backend/dist/luominest-backend/luominest-backend.exe"
          else
            BACKEND_EXE="backend/dist/luominest-backend/luominest-backend"
          fi
          if [ ! -f "$BACKEND_EXE" ]; then
            echo "[ERROR] Backend executable not found: $BACKEND_EXE"
            exit 1
          fi
          echo "[OK] Backend executable verified: $BACKEND_EXE"

      - name: Prepare backend resources
        shell: bash
        run: |
          mkdir -p frontend/resources/backend
          # Copy the entire backend dist folder (exe + shared libs) so the
          # bundled executable can find its dependencies at runtime.
          cp -r backend/dist/luominest-backend/* frontend/resources/backend/
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            chmod +x frontend/resources/backend/luominest-backend
          fi

      - name: Install frontend dependencies
        run: |
          cd frontend
          pnpm install --frozen-lockfile

      - name: Build frontend
        run: |
          cd frontend
          pnpm run build

      - name: Build Windows packages
        if: matrix.platform == 'win'
        run: |
          cd frontend
          pnpm exec electron-builder --win --publish never
        env:
          USE_HARD_LINKS: 'false'

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: |
          cd frontend
          pnpm exec electron-builder --linux AppImage deb --publish never

      - name: Build macOS packages
        if: matrix.platform == 'mac'
        run: |
          cd frontend
          pnpm exec electron-builder --mac --publish never
        env:
          # 无 Apple 开发者证书：跳过签名身份探测，产出未签名 dmg/zip。
          # 注意不要给 electron-builder 传 GH_TOKEN——它会据此生成自动更新
          # 元数据（updateInfo），项目未配置 publish/channel 时直接崩溃。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LuomiNest-${{ matrix.platform }}
          path: |
            frontend/release/dist/*
            !frontend/release/dist/win-unpacked
            !frontend/release/dist/linux-unpacked
            !frontend/release/dist/mac
          if-no-files-found: error

  create-release:
    needs: [detect, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.detect.outputs.tag }}
          name: ${{ needs.detect.outputs.name }}
          draft: false
          prerelease: ${{ needs.detect.outputs.prerelease }}
          generate_release_notes: true
          files: |
            artifacts/LuomiNest-win/*.exe
            artifacts/LuomiNest-linux/*.AppImage
            artifacts/LuomiNest-linux/*.deb
            artifacts/LuomiNest-mac/*.dmg
            artifacts/LuomiNest-mac/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
