name: Bug Report
description: Report a bug or issue in LuomiNest
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out the following information to help us identify the problem.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Please clearly describe the problem you encountered
      placeholder: "e.g., When clicking the send button, the message fails to send..."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Please provide steps to reproduce the issue
      placeholder: |
        1. Open LuomiNest
        2. Navigate to chat interface
        3. Type a message and click send
        4. Observe the error...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Describe what you expected to happen
      placeholder: "e.g., The message should be sent successfully and displayed in the chat window..."
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Describe what actually happened
      placeholder: "e.g., The message failed to send, showing an error prompt..."
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Select the affected component
      multiple: true
      options:
        - Backend (API)
        - Frontend (Desktop App)
        - Voice (ASR/TTS)
        - Live2D/Avatar
        - Memory System
        - MQTT/IoT
        - Firmware (ESP32)
        - Docker
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version Information
      description: Please provide the version you are using
      placeholder: "e.g., v0.1.0 or commit hash"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Please provide your runtime environment information
      placeholder: |
        - OS: Windows 11 / macOS 14 / Ubuntu 22.04
        - Python version: 3.12
        - Node.js version: 22.x
        - Docker version: 24.x (if used)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste relevant error logs or screenshots
      placeholder: "Paste log content or attach screenshots..."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing Issues and confirmed this is a new issue
          required: true
        - label: I have read the CONTRIBUTING.md document
          required: false
        - label: I am willing to help fix this issue
          required: false