name: Feature Request
description: Submit a new feature or improvement suggestion
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your suggestion! Please fill out the following information to help us understand your needs.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Describe the current problem or limitation
      placeholder: "e.g., Currently unable to use LuomiNest on mobile devices..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature or improvement you would like to see
      placeholder: "e.g., Would like to add mobile web app support..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions
      description: Describe any alternative solutions you have considered
      placeholder: "e.g., Could also consider developing a native mobile app..."
    validations:
      required: false
  - type: dropdown
    id: component
    attributes:
      label: Related Component
      description: Select the component related to this feature
      multiple: true
      options:
        - Backend (API)
        - Frontend (Desktop App)
        - Voice (ASR/TTS)
        - Live2D/Avatar
        - Memory System
        - MQTT/IoT
        - Firmware (ESP32)
        - Docker
        - Documentation
        - Other
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority Suggestion
      description: How do you think the priority of this feature should be?
      options:
        - High (Core functionality)
        - Medium (Important improvement)
        - Low (Optional enhancement)
    validations:
      required: true
  - type: dropdown
    id: help
    attributes:
      label: Would you like to help implement this?
      description: Select your level of participation
      multiple: true
      options:
        - Yes, I can help implement this feature
        - Yes, I can help with testing
        - Yes, I can help write documentation
        - No, but I can provide more suggestions
        - No, I am just suggesting
    validations:
      required: false
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Any other relevant information or reference materials
      placeholder: "e.g., Reference links to similar features, technical documentation..."
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      description: Please confirm the following
      options:
        - label: I have searched existing Issues and confirmed this is a new suggestion
          required: true
        - label: I have read the CONTRIBUTING.md document
          required: false